# Builds the Docker image and publishes it to Docker Hub when a version tag
# (v1.2.3) is pushed, or when release.yml calls it after a version bump. The
# tag must match the project's version and CHANGELOG.md
# must have an entry for it. Uses only the docker CLI on GitHub's own runner.
name: Docker

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# One run per tag, never cancelled, so every release is published. Moving tags
# (latest, major, minor) are only moved by the newest release they stand for,
# which keeps overlapping runs from moving them backwards.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Bygg och publicera
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Docker Hub-token ligger i miljön release, som bara main och v*-taggar
    # får använda.
    environment: release
    env:
      REPOSITORY: ${{ github.event.repository.name }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check variables
        run: |
          [ -n "$DOCKERHUB_USERNAME" ] || { echo "::error::The repository variable DOCKERHUB_USERNAME is not set."; exit 1; }
      - name: Version
        run: |
          version=$(tr -d "[:space:]" < version.txt)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Taggen $GITHUB_REF_NAME stämmer inte med versionen $version."
            exit 1
          fi
          grep -q "^## $version " CHANGELOG.md || { echo "::error::CHANGELOG.md saknar $version."; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Bygg
        run: docker build --pull -t "$IMAGE:$VERSION" .
      - name: Publicera
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
          # Prints the newest stable release (x.y.z) among the repository's tags ($tags)
          # plus this version, limited to those matching the regex in $1.
          newest() {
            { printf '%s\n' "$tags"; echo "$VERSION"; } | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | grep -E "$1" | sort -V | tail -n1
          }
          # True when this release is the newest one the moving tag $1 can stand for.
          # A prerelease never moves a moving tag.
          may_move() {
            case $VERSION in *-*) return 1 ;; esac
            if [ "$1" = latest ]; then re='.'; else re="^${1//./\\.}\\."; fi
            [ "$(newest "$re")" = "$VERSION" ]
          }
          major=${VERSION%%.*}
          minor=${VERSION%.*}
          # The exact version goes first; the moving tags only follow once it exists.
          docker push "$IMAGE:$VERSION"
          # A failed lookup must stop the job rather than look like "no other releases",
          # otherwise an old release could move the moving tags backwards.
          tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref | ltrimstr("refs/tags/v")') ||
            { echo "::error::Could not list the repository's release tags; no moving tag was changed."; exit 1; }
          # Try every moving tag even if one push fails, then fail the job. A re-run
          # only has to repeat what is missing, and the failure stays visible.
          failed=0
          for tag in "$minor" "$major" latest; do
            if ! may_move "$tag"; then
              echo "Not moving $tag: $VERSION is not the newest stable release it stands for."
              continue
            fi
            docker tag "$IMAGE:$VERSION" "$IMAGE:$tag"
            docker push "$IMAGE:$tag" || failed=1
          done
          docker logout docker.io
          [ "$failed" = 0 ]
      - name: Docker Hub-sidan
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # Needs a token with Read, Write and Delete; otherwise only a warning.
          jwt=$(jq -n --arg u "$DOCKERHUB_USERNAME" --arg p "$DOCKERHUB_TOKEN" '{username: $u, password: $p}' |
            curl -sf -X POST https://hub.docker.com/v2/users/login -H 'Content-Type: application/json' -d @- | jq -r .token)
          status=$(jq -n --rawfile d docker/README.md '{full_description: $d}' |
            curl -s -o /dev/null -w '%{http_code}' -X PATCH \
              "https://hub.docker.com/v2/namespaces/$DOCKERHUB_USERNAME/repositories/$REPOSITORY" \
              -H "Authorization: Bearer $jwt" -H 'Content-Type: application/json' -d @-)
          [ "$status" = 200 ] || echo "::warning::Docker Hub-sidan uppdaterades inte (HTTP $status). Token behöver Read, Write och Delete."
